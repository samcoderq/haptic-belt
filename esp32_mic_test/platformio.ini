; Separate project -- a second, plain ESP32-WROOM-32 (38-pin DevKitC-style)
; board, independent from the belt's ESP32-S3 firmware in ../src. Does not
; touch or depend on anything in the main project.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM16
monitor_port = COM16
