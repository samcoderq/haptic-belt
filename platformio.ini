[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; NimBLE, not the built-in Bluedroid BLEDevice -- much smaller flash/RAM
; footprint, and its API auto-manages the CCCD descriptor for any NOTIFY
; characteristic (android_app/BLE_PROTOCOL.md Section 2) instead of requiring
; it to be added by hand. Pinned to the 1.x line (not ^2.x) since this was
; never tested against a real device -- 1.x's createServer/createCharacteristic
; API is what this code is written against.
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Diagnostic while bringing up the first real BLE connection -- surfaces
    ; NimBLE's own internal NIMBLE_LOGx output (silently suppressed at the
    ; default level), which was otherwise invisible when advertising or
    ; connection setup failed.
    -DCORE_DEBUG_LEVEL=4

upload_port = COM20
monitor_port = COM20
monitor_speed = 115200
